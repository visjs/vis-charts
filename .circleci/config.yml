version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:26.13.0-browsers@sha256:01b628bd45035abd1ae517587902db3a40553a458395b90f323867234a5f06b4
    working_directory: ~/repo
    environment:
      GIT_AUTHOR_EMAIL: visjsbot@gmail.com
      GIT_AUTHOR_NAME: vis-bot
      GIT_COMMITTER_EMAIL: visjsbot@gmail.com
      GIT_COMMITTER_NAME: vis-bot

jobs:
  prepare:
    executor: node

    steps:
      - checkout

      - run: npm ci

      - persist_to_workspace:
          root: ..
          paths:
            - ".cache"
            - "repo"

  build:
    executor: node

    steps:
      - attach_workspace:
          at: ..

      - run: npm run build

      - persist_to_workspace:
          root: ..
          paths:
            - "repo/declarations"
            - "repo/dist"
            - "repo/esnext"
            - "repo/peer"
            - "repo/standalone"
            - "repo/styles"

  test_unit:
    executor: node

    steps:
      - attach_workspace:
          at: ..

      - run: npm run test:unit

  examples:
    executor: node

    steps:
      - attach_workspace:
          at: ..

      - run: npm run generate-examples-index

      - persist_to_workspace:
          root: ..
          paths:
            - "repo/examples"

  release:
    executor: node

    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Release
          command: |
            git config --global http.https://github.com/.extraheader "Authorization: Basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" # Workaround for https://bugs.launchpad.net/ubuntu/+source/git/+bug/2171054
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release

workflows:
  version: 2

  build:
    jobs:
      - prepare

      - build:
          requires:
            - prepare

      - test_unit:
          requires:
            - build

      - examples:
          requires:
            - build

      - release:
          requires:
            - prepare
            - build
            - examples
            - test_unit
          filters:
            branches:
              only:
                - master
